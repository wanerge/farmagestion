server:
  port: ${PORT:8080}

spring:
  application:
    name: farmagestion-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/farma_db}
    username: ${SPRING_DATASOURCE_USERNAME:farma_app}
    password: ${SPRING_DATASOURCE_PASSWORD:farma_dev_pass}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    jwt-secret: ${JWT_SECRET:local-dev-jwt-secret-solo-para-desarrollo-cambiar-en-prod-0123456789}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3002}
  integracion:
    eps-simulador-url: ${EPS_SIMULADOR_URL:http://localhost:3000}
    eps-simulador-api-key: ${EPS_SIMULADOR_API_KEY:local-dev-api-key}
    timeout-segundos: 10
    outbox-backoff-base-segundos: 60
    outbox-max-intentos: 10
  scheduling:
    enabled: ${APP_SCHEDULING_ENABLED:true}
    expirar-reservas-ms: 60000
    vencer-turnos-ms: 300000
    reintentar-outbox-ms: 60000
    sincronizar-formulas-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
app:
  security:
    jwt-secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  integracion:
    eps-simulador-url: ${EPS_SIMULADOR_URL}
    eps-simulador-api-key: ${EPS_SIMULADOR_API_KEY}
