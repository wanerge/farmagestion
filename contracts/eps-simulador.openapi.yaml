openapi: 3.0.3
info:
  title: Simulador EPS — API de servicio
  version: 1.0.0
  description: >
    Contrato de integración entre farmagestion-api y simulador-eps (00 §9).
    Todos los datos son sintéticos y sin validez clínica ni legal.
servers:
  - url: http://localhost:3000/api/v1
    description: Entorno local
  - url: https://farmagestion-simulador-eps.vercel.app/api/v1
    description: Producción (Vercel)

security:
  - ApiKeyAuth: []

paths:
  /health:
    get:
      operationId: health
      summary: Estado del servicio
      security: []
      responses:
        "200":
          description: Servicio operativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /formulas/{codigo}:
    get:
      operationId: consultarFormula
      summary: Consultar fórmula por código y documento del paciente
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            example: FRM-2026-000123
        - name: documento
          in: query
          required: true
          schema:
            type: string
            example: "1000000001"
      responses:
        "200":
          description: Fórmula encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormulaResponse"
        "401":
          description: API key ausente o inválida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Fórmula no encontrada o documento no coincide (code FORMULA_NO_ENCONTRADA)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /formulas/{codigo}/pdf:
    get:
      operationId: descargarFormulaPdf
      summary: Descargar PDF simulado de la fórmula
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
        - name: documento
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Documento PDF simulado
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: API key ausente o inválida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Fórmula no encontrada o documento no coincide (code FORMULA_NO_ENCONTRADA)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "501":
          description: Endpoint pendiente de implementación (P4)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /formulas/{codigo}/dispensaciones:
    post:
      operationId: registrarDispensacion
      summary: Registrar dispensación idempotente sobre una fórmula
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarDispensacionRequest"
      responses:
        "201":
          description: Dispensación registrada; devuelve la fórmula actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormulaResponse"
        "200":
          description: Repetición idempotente con la misma Idempotency-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormulaResponse"
        "400":
          description: Solicitud inválida (code VALIDACION_ERROR)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: API key ausente o inválida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Fórmula no encontrada (code FORMULA_NO_ENCONTRADA)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: >
            Conflicto de negocio: FORMULA_NO_DISPENSABLE (vencida, anulada o ya dispensada)
            o CANTIDAD_EXCEDE_AUTORIZADA
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Medicamento no pertenece a la fórmula (code MEDICAMENTO_NO_EN_FORMULA)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok

    EstadoFormula:
      type: string
      enum:
        - EMITIDA
        - PARCIALMENTE_DISPENSADA
        - DISPENSADA
        - VENCIDA
        - ANULADA

    PacienteFormulaDto:
      type: object
      additionalProperties: false
      required:
        - tipoDocumento
        - documento
        - nombres
        - apellidos
      properties:
        tipoDocumento:
          type: string
        documento:
          type: string
        nombres:
          type: string
        apellidos:
          type: string

    MedicoFormulaDto:
      type: object
      additionalProperties: false
      required:
        - nombre
      properties:
        nombre:
          type: string

    FormulaItemDto:
      type: object
      additionalProperties: false
      required:
        - medicamentoCodigo
        - medicamentoNombre
        - dosis
        - frecuencia
        - duracionDias
        - cantidadAutorizada
        - cantidadDispensada
      properties:
        medicamentoCodigo:
          type: string
        medicamentoNombre:
          type: string
        dosis:
          type: string
        frecuencia:
          type: string
        duracionDias:
          type: integer
          minimum: 1
        cantidadAutorizada:
          type: integer
          minimum: 1
        cantidadDispensada:
          type: integer
          minimum: 0

    FormulaResponse:
      type: object
      additionalProperties: false
      required:
        - codigo
        - estado
        - fechaEmision
        - fechaVencimiento
        - observaciones
        - paciente
        - medico
        - items
      properties:
        codigo:
          type: string
          pattern: "^FRM-\\d{4}-\\d{6}$"
        estado:
          $ref: "#/components/schemas/EstadoFormula"
        fechaEmision:
          type: string
          format: date
        fechaVencimiento:
          type: string
          format: date
        observaciones:
          type: string
          nullable: true
        paciente:
          $ref: "#/components/schemas/PacienteFormulaDto"
        medico:
          $ref: "#/components/schemas/MedicoFormulaDto"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FormulaItemDto"

    DispensacionItemRequest:
      type: object
      additionalProperties: false
      required:
        - medicamentoCodigo
        - cantidad
      properties:
        medicamentoCodigo:
          type: string
          minLength: 1
        cantidad:
          type: integer
          minimum: 1

    RegistrarDispensacionRequest:
      type: object
      additionalProperties: false
      required:
        - pedidoRef
        - sedeCodigo
        - fecha
        - items
      properties:
        pedidoRef:
          type: string
          minLength: 1
          maxLength: 60
        sedeCodigo:
          type: string
          minLength: 1
          maxLength: 32
        fecha:
          type: string
          format: date-time
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DispensacionItemRequest"

    ProblemDetail:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum:
            - VALIDACION_ERROR
            - API_KEY_INVALIDA
            - FORMULA_NO_ENCONTRADA
            - FORMULA_NO_DISPENSABLE
            - CANTIDAD_EXCEDE_AUTORIZADA
            - MEDICAMENTO_NO_EN_FORMULA
            - NO_IMPLEMENTADO
            - ERROR_INTERNO
