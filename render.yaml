services:
  - type: web
    name: farmagestion-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    autoDeploy: true
    dockerfilePath: ./services/farmagestion-api/Dockerfile
    dockerContext: ./services/farmagestion-api
    healthCheckPath: /api/v1/health
    buildFilter:
      paths:
        - services/farmagestion-api/**
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        value: farma_app
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EPS_SIMULADOR_URL
        sync: false
      - key: EPS_SIMULADOR_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
